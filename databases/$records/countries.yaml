format: ovdb-directory/draft-1
title: Countries reference database
description: >-
  Countries and territories keyed by ISO 3166-1 alpha-2 code, with the
  alpha-3 code, English name, currency and the latest World Bank population
  with its year and source, plus aliases for joining sample databases such as
  Northwind and Chinook. Derived from GeoNames and World Bank open data under
  CC BY 4.0; the read-only SQLite build has 3 tables and 1 view.
