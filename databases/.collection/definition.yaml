# One record per registered OpenVaultDB database, keyed by its record alias
# (databases/$records/<recordId>.yaml). Format ovdb-directory/draft-1; README.md
# explains every column. inGitDB checks what is declared here (types,
# required, enums, lengths, foreign keys); scripts/check.mjs checks what a
# column definition cannot say (the id and URL shapes, unique URLs, and
# everything about the publisher repository at the pinned commit).
titles:
  en: OpenVaultDB databases

record_file:
  name: '{key}.yaml'
  format: yaml
  type: map[string]any

columns:
  format:
    type: string
    required: true
    enum: [ovdb-directory/draft-1]
  title:
    type: string
    required: true
    min_length: 1
    max_length: 120
  description:
    type: string
    required: true
    min_length: 1
  status:
    type: string
    required: true
    enum: [draft, published, deprecated]
  # url and repository carry no `format:` hint: inGitDB treats `format` as a
  # rendering hint and does not validate it. scripts/check.mjs checks both:
  # url is a canonical https URL, repository is an https URL on an allowed
  # host without .git, and neither is registered twice.
  url:
    type: string
    required: true
  repository:
    type: string
    required: true
  commit:
    type: string
    required: true
    length: 40
  manifest:
    type: string
    required: true
    min_length: 1
  # Optional public JSON descriptor; older publishers may expose only the YAML manifest.
  database_manifest:
    type: string
    min_length: 1
  meaning_graph:
    type: string
    required: true
    min_length: 1
  maintainers:
    type: '[]string'
    required: true
    min_length: 1
    foreign_key: maintainers

columns_order:
  - format
  - title
  - description
  - status
  - url
  - repository
  - commit
  - manifest
  - database_manifest
  - meaning_graph
  - maintainers
