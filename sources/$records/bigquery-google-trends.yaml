activation_blockers:
  - Current exact source project/dataset/table identities, location, object type and native schema/types/modes/constraints require separately authorized metadata-only evidence and a bounded table allowlist before activation.
  - Authentication, execution-project IAM, explicit cost admission, finite SQL/output/time/bytes limits, and real Go plus browser acceptance remain pending.
  - Owned no-retention enforcement and separately scoped authorization of BigQuery result materialization are required before any query, including free jobs.
  - Establish which terms apply to the exact BigQuery distribution and intended use, including attribution and any third-party geography requirements, before activation.
notices:
  - Google's current dataset help https://support.google.com/trends/answer/12764470 documents bigquery-public-data.google_trends.top_terms as a candidate only; no current table, binding or query allowlist is accepted here.
  - Search-interest data is aggregated and normalized; scores are not raw search volumes. Advertised rolling windows and cadence are not current freshness guarantees. International/hourly tables and DMA/country mappings are not accepted.
  - Google's use and citation guidance permits information use subject to Google Terms and requires attribution when reused. This entry grants no independent data licence or clearance for the proposed BigQuery route. Attribution should identify Google Trends and avoid conflating it with Google Ads.
  - Third-party geography requirements remain unresolved; DMA boundaries are not licensed by this listing.
  - Pinned authored definitions establish documented candidate names, not current existence, permissions, storage region, freshness or a deployed query service. Repository code/documentation licences do not licence dataset contents.
  - BigQuery writes query results to destination or temporary tables. Disabling cache retrieval does not prevent provider materialization; typical temporary caching of about 24 hours is not a guaranteed maximum deletion period.
  - This entry serves descriptive metadata only. It contains no source rows, accepted native schema, model/meaning binding, query endpoint, execution credential or cost authorization.
