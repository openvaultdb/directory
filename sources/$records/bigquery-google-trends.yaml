activation_blockers:
  - Two metadata-only observations establish the native field names, types and modes of top_terms and international_top_terms in US at 2026-10-07T15:39:14Z. Query activation still requires an accepted exact table allowlist and complete execution metadata; these table/time observations do not establish dataset-wide coverage or freshness.
  - Authentication, execution-project IAM, explicit cost admission, finite SQL/output/time/bytes limits, and real Go plus browser acceptance remain pending.
  - Owned no-retention enforcement and separately scoped authorization of BigQuery result materialization are required before any query, including free jobs.
  - Establish which terms apply to the exact BigQuery distribution and intended use, including attribution and any third-party geography requirements, before activation.
notices:
  - Google's current dataset help https://support.google.com/trends/answer/12764470 documents bigquery-public-data.google_trends.top_terms; Google's international article https://cloud.google.com/blog/products/data-analytics/international-google-trends-datasets-in-bigquery documents international_top_terms. The two exact tables now have provider metadata observations, but no binding or query allowlist is accepted here.
  - Search-interest data is aggregated and normalized; scores are not raw search volumes. Advertised rolling windows and cadence are not current freshness guarantees. Other international/hourly tables and DMA/country mappings are not accepted.
  - Google's use and citation guidance permits information use subject to Google Terms and requires attribution when reused. This entry grants no independent data licence or clearance for the proposed BigQuery route. Attribution should identify Google Trends and avoid conflating it with Google Ads.
  - Third-party geography requirements remain unresolved; DMA boundaries are not licensed by this listing.
  - Pinned authored definitions establish documented candidate names only. The two exact metadata observations establish table existence and US location at their observation time, but not permissions, freshness or a deployed query service. Repository code/documentation licences do not licence dataset contents.
  - BigQuery writes query results to destination or temporary tables. Disabling cache retrieval does not prevent provider materialization; typical temporary caching of about 24 hours is not a guaranteed maximum deletion period.
  - This entry serves descriptive metadata only. Its two partial public schema observations are bound to the named tables at 2026-10-07T15:39:14Z; they contain no source rows, complete execution schema, model/meaning binding, query endpoint, execution credential or cost authorization.
