activation_blockers:
  - Authorized metadata-only dataset/table inspection must establish current existence, location, native schema/types/modes and an exact bounded table allowlist. No observation table is accepted here.
  - Indicator-specific provider rights, edition and attribution must be accepted for the exact intended use. World Bank summary terms do not grant unrestricted dataset-wide commercial entitlement.
  - Economy/aggregate identity, units, year coverage and semantic/model bindings require independent acceptance; no registered model is claimed.
  - Authentication and a separate execution project, cost admission, finite query/output limits and Go/JavaScript runtime acceptance remain pending.
  - Owned no-retention enforcement and explicit provider result-storage authorization are required before any query, including free jobs.
notices:
  - Attribution is required to the World Bank and its data providers as specified in their metadata. No World Bank endorsement is implied.
  - World Bank summary terms generally use CC BY 4.0 with mandatory additions, subject to dataset and indicator/provider exceptions. Some indicators require additional consent or have noncommercial restrictions.
  - The pinned Google-authored definition documents the dataset name; the public-program source project is a discovery candidate, not an authenticated metadata receipt. The repository is deprecated and its schedule is not a freshness guarantee.
  - BigQuery writes query results to destination or temporary tables. Disabling query-cache retrieval does not prevent provider materialization; typical temporary cache duration is about 24 hours, not a guaranteed maximum deletion period.
  - This entry serves descriptive metadata only. It contains no copied source rows, table schema assertion, query endpoint, execution credential or cost authorization.
