recordsets:
  - name: WindowsZoneMap
    description: Partial documented attributes on
      /supplementalData/windowsZones/mapTimezones/mapZone in explicit CLDR 48. Actual
      element/attribute presence and full edition schema remain unverified by a data
      read.
    fields:
      - name: other
        type: string
        description: Native XML Windows TZID attribute string; descriptive resemblance is not
          zone identity.
      - name: territory
        type: string
        description: Native XML context attribute string. 001 default and ZZ remain distinct; no
          sovereign-country or territory-code equivalence is admitted.
      - name: type
        type: string
        description: Native XML space-delimited Unicode long timezone-ID list string. Preserve
          aliases and list order; no scalar timezone or tzdb identity mapping is
          accepted.
