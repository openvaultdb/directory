recordsets:
  - name: Admin1Code
    description: Partial proposed metadata for the documented administrative
      code/name/geonameid columns. Code namespaces require country context; these codes
      must not be globally equated with ISO subdivisions. The exact code parser, native
      bindings and missing-reference behavior remain unaccepted.
    fields:
      - name: code
        type: string
        description: Native combined administrative key; exact decomposition and namespace
          acceptance pending.
      - name: name
        type: string
        description: Documented administrative display name.
      - name: geonameid
        type: string
        description: Lexical GeoNames feature identifier; closure against the place resource
          remains unverified.
