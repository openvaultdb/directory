recordsets:
  - name: HolidayDivision
    description: Partial native string at each top-level division object. Parent division
      context is not a native scalar field within its events[] children.
    fields:
      - name: division
        type: string
        description: Native division identifier string on the enclosing object; preserve source
          namespace and do not infer a division from UK country labels.
  - name: HolidayEvent
    description: Partial native strings relative to events[] within a division object. Event
      meaning requires parent division context; no flattened division field or accepted
      relationship binding is created.
    fields:
      - name: title
        type: string
        description: Native event title string. It is not a universal or unique event identifier.
      - name: date
        type: string
        description: Native event date string. Parse policy and division-qualified grain need
          admission; do not infer instant/timezone semantics.
      - name: notes
        type: string
        description: Native notes string, including empty strings. No legal obligation or
          closure inference.
