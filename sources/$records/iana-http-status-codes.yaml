recordsets:
  - name: HttpStatusRegistryRow
    description: Native CSV row subset with lexical status values/ranges. RFC-compliant CSV
      parsing, reserved/unassigned rows and current headers remain admission gates.
    fields:
      - name: Value
        type: string
        description: Native lexical CSV value, potentially a range/reserved/unassigned entry. Do
          not coerce every row to one integer or accept whole-column scalar semantics.
      - name: Description
        type: string
        description: Native CSV descriptive text; preserve assignment status and strings without
          treating them as observed response content.
      - name: Reference
        type: string
        description: Native CSV reference text only; referenced RFCs/other material are outside
          the registry-data rights scope and must not be fetched implicitly.
