  or log-enrichment query.
status: inactive
publisher: Internet Assigned Numbers Authority (IANA)
homepage: https://www.iana.org/assignments/http-status-codes/
resource_url: https://www.iana.org/assignments/http-status-codes/http-status-codes-1.csv
terms_url: https://www.iana.org/help/licensing-terms
access_mode: live-http-via-ovdb
retention: none
activation_blockers:
  - No admitted execution route exists. live-http-via-ovdb names a proposed gateway;
    actual GET/CORS/authentication/rate limits, redirect/DNS/resource allowlists and
    row/byte/time budgets remain unverified.
  - Canonical source definition, bounded decoder and source-qualified
    ModelSpec/MeaningGraph bindings require separate acceptance. This partial
    native-string subset does not model the complete source response, context or
    grammar.
  - Rights for the exact returned material and intended use and required notices remain
    admission gates. Licence permission never authorizes source snapshots or result
    retention in this programme.
  - Transient RAM/current-display execution and no-store enforcement across browser,
    adapter, OVDB, edge and intermediary sinks remain unproved. Retained
    paging/history/export/download/fixtures/replay and data-bearing logs are not
    authorized.
  - Exact execution observation metadata, native context, null/missing/multiplicity
    policy and freshness remain unverified. Resource HEAD and authored metadata pins do
    not establish current rows or future response bytes.
  - d2-map-iana-status remains unresolved because Value includes ranges. Exact
    scalar-code projection and actual log-field binding require reconciliation.
notices:
  - "Delivered implementation evidence, not live-source acceptance: the fixed lexical
    CSV mount is documented at
    https://github.com/openvaultdb/openvaultdb-go/blob/4e7164ac1d4973c95b44822a19e231a662987ce8/docs/http-iana.md.
    It requires ordered Value,Description,Reference headers, preserves strings and
    ranges, and bounds the fixed GET to 64 KiB, 512 parsed rows and 10 seconds with
    no redirects or snapshot fallback. Its native query profile requires limit
    1-50 and refuses point reads, writes, paging, aliases, joins, ordering and
    offsets. These are implemented constraints, not observed current CSV content
    or accepted scalar status-code semantics."
  - "Default-off operator composition is documented at
    https://github.com/openvaultdb/cloud/blob/0414c51e6363b3be81905960c70912763d5a9a87/server/IANA.md.
    Directory-authored metadata is discovery evidence; it cannot establish
    publisher verification. Publisher-definition, decoder and rights digests and
    an independently accepted operator decision remain separate requirements.
    The per-execution 50-row envelope does not authorize a pilot, public access or
    paid use. Synthetic component checks do not establish live execution,
    production configuration, deployed sink behavior or a Directory browser
    journey; this entry remains inactive with all activation blockers retained."
  - Metadata/documentation and endpoint HEAD checked 2026-10-06. No source dataset
    payload was requested or retained; no query service is activated.
  - IANA/IETF CC0 statement covers applicable protocol-registry rights and excludes
    linked RFC text/other material. No trademark/patent/third-party guarantee follows.
  - Proposed CSV header names are recorded in dated candidate d2-rs-iana-http, supported
    by evidence d2-e-iana, at hub 95a41f656040694d31c3b118cd8f220126931cf5. Current HEAD
    confirms a CSV resource, not current headers/rows or browser GET access.
  - W3 selection records five inactive source opportunities only. NVD remains deferred
    pending authoritative current terms; all unselected candidate IDs and original
    dispositions remain in datatug/datatug spec/research/public-data-fabric. No source
    reads, canonical binding admission or DataTug UI change is authorized by this entry.
recordsets:
  - name: HttpStatusRegistryRow
    description: Native CSV row subset with lexical status values/ranges. RFC-compliant CSV
      parsing, reserved/unassigned rows and current headers remain admission gates.
    fields:
      - name: Value
        type: string
        description: Native lexical CSV value, potentially a range/reserved/unassigned entry. Do
          not coerce every row to one integer or accept whole-column scalar semantics.
      - name: Description
        type: string
        description: Native CSV descriptive text; preserve assignment status and strings without
          treating them as observed response content.
      - name: Reference
        type: string
        description: Native CSV reference text only; referenced RFCs/other material are outside
          the registry-data rights scope and must not be fetched implicitly.
