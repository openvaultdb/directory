format: ovdb-source/draft-1
title: ROR research organization references
description: Inactive W1 discovery for d1-ror-organisations. The original ROR
  organizations API is a candidate exact-key affiliation reference with GeoNames
  locations; no query or ROR-to-place closure is activated.
status: inactive
publisher: Research Organization Registry (ROR)
homepage: https://ror.org/
resource_url: https://api.ror.org/v2/organizations
terms_url: https://ror.org/about/terms/
access_mode: live-http-via-ovdb
retention: none
activation_blockers:
  - Copied-provider activation is frozen. A working bounded original-resource route or
    specific user retention authorization is required; existing copies remain inactive and
    preserved.
  - No admitted execution gateway exists. The access_mode names a proposed OVDB Go proxy
    route only; direct-browser CORS/authentication, exact resource reads, redirect/DNS
    allowlists and row/byte/time budgets remain unverified.
  - Canonical source definition, decoder, ModelSpec and MeaningGraph artifacts and exact
    native-field bindings require separate acceptance. Related registered projection metadata is linked
    for browsing only; no accepted original-resource mappings are asserted here.
  - Rights for the exact returned material and intended use, attribution/change notices,
    full W1 reference closure and missing-reference behavior remain admission gates.
  - Transient RAM/current-display execution and no-store enforcement across browser, OVDB,
    adapter, edge and intermediary sinks remain unproved. Retained paging, histories,
    exports, fixtures, replay caches and data-bearing logs are not authorized.
  - "Exact API rights for embedded GeoNames locations need clarification: the current
    data-structure page names CC BY 3.0 while reviewed ROR data release 2.13 on Zenodo
    names CC BY 4.0. Preserve attribution and source-specific evidence; do not infer a
    blanket CC0 exemption."
  - The base list defaults to active records. All-status and exact-ID access,
    multi-location cardinality, complete references and missing/inactive/withdrawn
    behavior require runtime acceptance; a list or dump alone cannot prove bounded W1
    closure.
notices:
  - "Source: Research Organization Registry (ROR). Documentation checked on 2026-10-06; no
    organization rows or release archive were read or retained."
  - ROR terms provide IDs and metadata under CC0 1.0; website prose is separately CC BY
    4.0. Embedded GeoNames geography requires distinct attribution and material-specific
    licence acceptance.
  - "Rights discrepancy: https://ror.readme.io/docs/ror-data-structure lists GeoNames CC
    BY 3.0; https://zenodo.org/records/22902037 states CC BY 4.0 for location data in ROR
    data release 2.13. This release is rights evidence only, not the original live API
    resource or an admitted snapshot."
  - "API documentation: https://ror.readme.io/docs/rest-api and
    https://ror.readme.io/docs/api-single. Single-ID requests can return
    inactive/withdrawn records; list calls default to active unless all_status is
    requested. API search/list limits do not establish full-registry access."
  - "Documented API rate limit: 2000 requests per five minutes per IP. Registration
    requirements, CORS, response schema, availability and future changes must be
    revalidated before activation."
  - Research organization identity does not establish legal-entity identity, ROR/LEI
    equivalence or resolution of names and local demo IDs. Locations and relationships are
    native arrays and must not be flattened into false scalar fields or counted as
    organizations.
recordsets:
  - name: Organization
    description: "Partial proposed native scalar metadata only: id and status. ROR schema 2.1
      documents names, locations and relationships as arrays, including
      locations.geonames_id and relationship id/type. Their models, multiplicity, missing
      references and exact field bindings are dependencies, not accepted scalar
      projections in this entry."
    fields:
      - name: id
        type: string
        description: Native full ROR identifier string; an exact namespace key rather than a fuzzy
          organization-name match.
      - name: status
        type: string
        description: "Native status string: active, inactive or withdrawn. Source status is
          distinct from this discovery entry being inactive."
maintainers:
  - trakhimenok

modelspec_url: https://modelspec.org/registry/models/ror/
meaninggraph_url: https://meaninggraph.io/graphs/ror/
